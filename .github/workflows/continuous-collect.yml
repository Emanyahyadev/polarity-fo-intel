name: continuous-collect

# The 48-hour data-filling marathon: wakes the operating cycle every 60 minutes
# until 700 verified contacts are released into data/final/ (or 48h elapse).
# Each cycle is idempotent (release MERGES into the canonical store by fo_id;
# existing rows win), so re-running never duplicates. Verified contact = a released
# record with an independent verification source AND at least one reachable
# channel (published email / phone / LinkedIn / website).
#
# A concurrency group guards the shared data/final workspace against the
# twice-daily operating-cycle job.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Verified contacts to collect"
        required: false
        default: "700"
      hours:
        description: "Run-time budget (hours)"
        required: false
        default: "48"

concurrency:
  group: polarity-fointel-operate
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2880            # 48h
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + LangGraph execution engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.txt
          pip install "langgraph>=0.3,<0.4"
          pip list

      - name: Set execution engine (LangGraph by default; orchestrator = rollback)
        run: echo "FOINTEL_ENGINE=${FOINTEL_ENGINE:-langgraph}" >> "$GITHUB_ENV"

      - name: Continuous collect (48h, 700 verified contacts)
        run: |
          python operations/operate.py --continuous \
            --per-source 200 --max-build 150 \
            --interval 60 --target ${{ inputs.target }} --hours ${{ inputs.hours }}
        env:
          TARGET_RECORDS: 700
          FOINTEL_ENGINE: langgraph
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Materialize dataset + refresh retrieval index (safety re-export)
        run: |
          python scripts/reexport_from_store.py
        env:
          TARGET_RECORDS: 700
          FOINTEL_ENGINE: langgraph

      - name: Regenerate observability history (run/build/session)
        run: python scripts/generate_history.py

      - name: Commit data back to repository
        run: |
          git config --global user.name "Family Office AI Agents"
          git config --global user.email "ai@polarityiq.com"
          git add -f data/final/* || true
          git commit -m "chore(data): continuous collect — 48h verified-contact dataset update" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push

      - name: Upload operating trace + history artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-logs
          path: |
            logs/operating/
            notes/
          retention-days: 14
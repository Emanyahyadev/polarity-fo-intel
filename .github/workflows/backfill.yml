name: backfill-acquisition

# Catch-up (backfill) acquisition to the release target — the 500 gate-passing
# record milestone. Triggered manually when the scheduled operating cycle alone
# cannot bridge the gap before the deadline.
#
# Runs the SAME autonomous operating cycle repeatedly under one heartbeat marker
# (mode="backfill"): scheduled 2-hour windows skip while this run is live
# (overlap policy — no duplicate cycles). The run is checkpointed under
# data/backfill/ (checkpoint.json + live progress.json), so a killed job can be
# re-triggered and it RESUMES from the last completed cycle instead of restarting.
#
# Stop conditions: TARGET (gate-passing >= input), DEADLINE (wall clock, UTC),
# or SAFETY (3 consecutive fatal cycle failures — quality over quantity, and a
# broken pipeline is never papered over).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Gate-passing records to release (only ReleaseGate-passing records count)"
        required: false
        default: "500"
      deadline:
        description: "ISO-8601 deadline (UTC) ending the run"
        required: false
        default: "2026-08-10T17:00:00+00:00"
      per_source:
        description: "Discovery candidates per source per operating cycle"
        required: false
        default: "250"
      max_build:
        description: "Enrichment build cap per operating cycle"
        required: false
        default: "200"
      git_sync_every:
        description: "Live commit+push (data/final + backfill state) every N cycles (0 = disabled)"
        required: false
        default: "4"

# Same shared store floor as the scheduled cycle: one operating run at a time.
concurrency:
  group: polarity-fointel-operate
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 780          # ~13h: room to bridge 80 -> 500 before the deadline
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + LangGraph execution engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.txt
          pip install "langgraph>=0.3,<0.4"

      - name: Seed the candidate pool from the committed snapshot
        # data/fointel.db is gitignored, so a hosted runner starts with an EMPTY
        # pool and would re-discover the same firms every run, discarding the work
        # at job end. Seeding from the committed JSON snapshot makes discovery
        # cumulative across runs instead of amnesiac.
        run: python scripts/pool_snapshot.py import

      - name: Run backfill acquisition (checkpointed, resumable)
        run: |
          git config --global user.name "Family Office AI Agents"
          git config --global user.email "ai@polarityiq.com"
          python operations/operate.py \
            --backfill \
            --backfill-target "${{ github.event.inputs.target }}" \
            --deadline "${{ github.event.inputs.deadline }}" \
            --per-source "${{ github.event.inputs.per_source }}" \
            --max-build "${{ github.event.inputs.max_build }}" \
            --git-sync-every "${{ github.event.inputs.git_sync_every }}"
        env:
          TARGET_RECORDS: 500
          FOINTEL_ENGINE: langgraph
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Materialize dataset + refresh retrieval index (safety re-export)
        run: python scripts/reexport_from_store.py
        env:
          TARGET_RECORDS: 500
          FOINTEL_ENGINE: langgraph

      - name: Regenerate observability history (run/build/session)
        run: python scripts/generate_history.py

      - name: Commit data back to repository
        run: |
          python scripts/pool_snapshot.py export
          git config --global user.name "Family Office AI Agents"
          git config --global user.email "ai@polarityiq.com"
          git add -f data/final/* data/backfill/* || true
          [ -d data/freshness ] && git add -f data/freshness/* || true
          [ -d data/pool ] && git add -f data/pool/* || true
          [ -d notes ] && git add -f notes/* || true
          git commit -m "chore(data): backfill acquisition update to release target" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push

      - name: Upload backfill checkpoint, report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs
          path: |
            data/backfill/
            logs/operating/
            notes/
          retention-days: 30          # checkpoint kept to RESUME if this job died mid-run
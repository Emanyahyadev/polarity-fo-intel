name: operating-cycle

# The autonomous operating window (Eman Phase 1 Steps 4-7, LangGraph migration
# Phase 8): on a schedule, the scheduler agent wakes and runs the AI Employee
# operating cycle. Execution engine = LangGraph StateGraph by default
# (FOINTEL_ENGINE=langgraph); set FOINTEL_ENGINE=orchestrator in the repo vars to
# run the legacy deterministic loop (the rollback path). Both engines run the same
# employees, respect the same Policy Engine, and audit to logs/operating/*.jsonl.
# Any decision the Policy Engine marks Tier 2/3 is NOT run — it is queued for
# review instead (never guessed, never silently published).

on:
  schedule:
    - cron: "0 */2 * * *"      # every 2 hours (12 windows/day, UTC; :00 on the hour)
  workflow_dispatch: {}        # allow a manual operating-cycle run

# One runner at a time on the shared data/final workspace, and — on top of that —
# the operate.py entrypoint holds a heartbeat marker (data/.cycle-marker.json):
# if a window is STILL RUNNING when the next 2-hour window fires, the later one
# SKIPS and logs scheduler.skip_overlap instead of queuing a duplicate cycle.
concurrency:
  group: polarity-fointel-operate
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + LangGraph execution engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.txt
          pip install "langgraph>=0.3,<0.4"
          pip list

      - name: Set execution engine (LangGraph by default; orchestrator = rollback)
        run: echo "FOINTEL_ENGINE=${FOINTEL_ENGINE:-langgraph}" >> "$GITHUB_ENV"

      - name: Wake the operating cycle (all 14 AI employees, real discovery)
        run: |
          python operations/operate.py --per-source 100 --max-build 50
        env:
          TARGET_RECORDS: 500
          FOINTEL_ENGINE: langgraph
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Materialize dataset + refresh retrieval index (safety re-export)
        run: |
          python scripts/reexport_from_store.py
        env:
          TARGET_RECORDS: 500
          FOINTEL_ENGINE: langgraph

      - name: Regenerate observability history (run/build/session)
        run: python scripts/generate_history.py

      - name: Commit data back to repository
        run: |
          git config --global user.name "Family Office AI Agents"
          git config --global user.email "ai@polarityiq.com"
          git add -f data/final/* || true
          git commit -m "chore(data): autonomous data update via operating cycle" || echo "No changes to commit"
          git push

      - name: Upload operating trace + history artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-logs
          path: |
            logs/operating/
            notes/
          retention-days: 7
